<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Local WiFi survey, network and RF tool" />
    <title>Signal Boy</title>
    <link rel="stylesheet" href="/css/pixel.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%239bbc0f'/%3E%3Crect x='1' y='5' width='1' height='2' fill='%230f380f'/%3E%3Crect x='3' y='3' width='1' height='4' fill='%230f380f'/%3E%3Crect x='5' y='1' width='1' height='6' fill='%230f380f'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="device">
      <div class="lcd">
        <header class="titlebar">
          <h1>Signal Boy</h1>
          <p class="sub">
            <span class="led" id="led" data-state="connecting"></span>
            <span id="conn">Connecting</span>
            &middot;
            <span id="host-platform">&mdash;</span>
          </p>
        </header>

        <div id="companion"></div>

        <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>

        <main id="views"></main>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
